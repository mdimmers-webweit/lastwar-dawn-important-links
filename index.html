<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DawN — Last War Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261020-sensible-view">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="wrap" id="wrap">
    <header class="site-head glass">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">☀</span>
        <div>
          <p class="brand-kicker">Alliance Ops</p>
          <h1 class="brand-title">DawN</h1>
        </div>
      </div>
      <div class="head-tools">
        <a class="tool-link" href="/links/" target="_blank" rel="noopener noreferrer">Important Links</a>
        <a class="tool-link" href="https://lastwar-daily-anno.pages.dev/" target="_blank" rel="noopener noreferrer">DawN Anno</a>
        <div class="stamp" id="stamp">Lade Daten…</div>
      </div>
    </header>

    <div class="bar glass">
      <div class="row">
        <div class="tabs" role="tablist" aria-label="Dashboard-Bereiche">
          <button class="tab" role="tab" id="tab-overview" aria-selected="true" aria-controls="view-overview" data-view="overview">Overview</button>
          <button class="tab" role="tab" id="tab-kills" aria-selected="false" aria-controls="view-kills" data-view="kills">Kills</button>
          <button class="tab" role="tab" id="tab-donations" aria-selected="false" aria-controls="view-donations" data-view="donations">Donations</button>
          <button class="tab" role="tab" id="tab-vs" aria-selected="false" aria-controls="view-vs" data-view="vs">VS</button>
          <button class="tab" role="tab" id="tab-season" aria-selected="false" aria-controls="view-season" data-view="season">Season</button>
          <button class="tab" role="tab" id="tab-events" aria-selected="false" aria-controls="view-events" data-view="events">Events</button>
          <button class="tab" role="tab" id="tab-activity" aria-selected="false" aria-controls="view-activity" data-view="activity">Activity</button>
          <button class="tab" role="tab" id="tab-links" aria-selected="false" aria-controls="view-links" data-view="links">Links</button>
          <button class="tab" role="tab" id="tab-config" aria-selected="false" aria-controls="view-config" data-view="config">Config</button>
        </div>
      </div>
    </div>

    <div id="filterMount" class="filter-mount" hidden aria-label="Mitglieder-Filter"></div>

    <div id="bootErr" class="err glass" hidden></div>

    <div class="view" id="view-overview" role="tabpanel" aria-labelledby="tab-overview"></div>
    <div class="view" id="view-kills" role="tabpanel" aria-labelledby="tab-kills" hidden></div>
    <div class="view" id="view-donations" role="tabpanel" aria-labelledby="tab-donations" hidden></div>
    <div class="view" id="view-vs" role="tabpanel" aria-labelledby="tab-vs" hidden></div>
    <div class="view" id="view-season" role="tabpanel" aria-labelledby="tab-season" hidden></div>
    <div class="view" id="view-events" role="tabpanel" aria-labelledby="tab-events" hidden></div>
    <div class="view" id="view-activity" role="tabpanel" aria-labelledby="tab-activity" hidden></div>
    <div class="view" id="view-links" role="tabpanel" aria-labelledby="tab-links" hidden></div>
    <div class="view" id="view-config" role="tabpanel" aria-labelledby="tab-config" hidden></div>

    <footer class="foot glass" id="foot"></footer>
  </div>
  <script src="app.js?v=20261020-table-sort"></script>
</body>
</html>
