<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DawN — Important Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="stage">
    <header class="hero">
      <img class="hero-art" src="assets/dawn.png" alt="DawN — It's always darkest before DAWN" width="1024" height="1024">
      <div class="hero-copy">
        <p class="brand" id="brand">DawN</p>
        <p class="tagline" id="tagline">Important links</p>
      </div>
    </header>

    <section class="links" aria-label="Important links">
      <p id="err" class="err" hidden></p>
      <ul id="list" class="link-list">
        <li class="loading">Loading…</li>
      </ul>
    </section>

    <section class="add" aria-label="Add a link">
      <h2>Add link</h2>
      <form id="addForm" class="add-form">
        <label>
          <span>Name / Description</span>
          <input type="text" id="fieldName" name="name" required placeholder="e.g. DawN Tracker" autocomplete="off">
        </label>
        <label>
          <span>Link</span>
          <input type="url" id="fieldUrl" name="url" required placeholder="https://…" autocomplete="off">
        </label>
        <button type="submit" id="btnAdd">Add</button>
      </form>
      <p id="addStatus" class="status" hidden></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
